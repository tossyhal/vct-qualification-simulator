<title>VCT Qualification Simulator</title>
<style>
  :root {
    color-scheme: light;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: #d9d4cd;
    color: #171717;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { overflow-x: hidden; }
  button { font: inherit; }
  button:focus-visible { outline: 3px solid #2f65f5; outline-offset: 2px; }

  .controlbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    align-items: center;
    padding: 12px max(12px, calc((100vw - 1120px) / 2));
    background: #f7f5f2;
    border-bottom: 1px solid #beb8af;
  }
  .control-group { display: flex; gap: 4px; align-items: center; }
  .control-label { margin-right: 5px; font-size: 12px; font-weight: 700; color: #68635d; }
  .controlbar button {
    cursor: pointer;
    padding: 5px 9px;
    border: 1px solid #b9b2aa;
    background: transparent;
    color: #302d2a;
    font-size: 12px;
  }
  .controlbar button:hover { background: #e8e3dd; }
  .controlbar button[aria-selected="true"],
  .controlbar button[aria-pressed="true"] { background: #26221f; color: #fff; border-color: #26221f; }

  .stage { padding: 22px 12px 70px; }
  .canvas {
    width: min(100%, 1120px);
    margin: 0 auto;
    padding: 28px clamp(12px, 3vw, 36px) 52px;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
  }
  .canvas.mobile { width: 375px; max-width: 100%; margin-left: auto; margin-right: auto; }

  .masthead { display: flex; justify-content: space-between; gap: 22px; align-items: end; padding-bottom: 19px; border-bottom: 2px solid var(--strong); }
  .masthead h1 { max-width: 720px; margin: 0; font-size: clamp(24px, 5vw, 54px); line-height: .96; letter-spacing: -.055em; color: var(--strong); }
  .masthead .serial { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 800; letter-spacing: .16em; color: var(--accent); }
  .tournament-tabs { display: flex; flex-wrap: wrap; gap: 7px 20px; align-items: baseline; padding: 12px 0 20px; }
  .content-tab {
    cursor: pointer;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-weight: 800;
  }
  .content-tab:hover { color: var(--strong); }
  .content-tab[aria-selected="true"] { color: var(--strong); }
  .tournament-tab { font-size: 14px; }

  .group { margin-top: 22px; }
  .group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--strong); }
  .group-tabs { display: flex; gap: 18px; }
  .group-tab { font-size: 19px; letter-spacing: .02em; }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
  col.team-col { width: 30%; }
  col.direct-col { width: 11%; }
  col.pos-col { width: 9.8333%; }
  th, td { min-width: 0; }
  thead th { padding: 7px 3px; color: var(--muted); text-align: right; font-size: 10px; font-weight: 800; line-height: 1.15; }
  thead th:first-child { text-align: left; }
  thead th:nth-child(2) { color: var(--accent); }
  tbody th, tbody td { padding: 9px 3px; border-bottom: 1px solid var(--rule); text-align: right; vertical-align: middle; }
  tbody th { text-align: left; font-weight: 400; }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
  .team-cell { display: grid; grid-template-columns: 18px minmax(0, 1fr); column-gap: 5px; align-items: baseline; }
  .rank { color: var(--muted); font-size: 11px; font-weight: 700; }
  .short { display: inline-block; color: var(--strong); font-size: 14px; font-weight: 900; letter-spacing: -.02em; }
  .record { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; line-height: 1.15; }
  .prob { display: flex; min-height: 31px; align-items: center; justify-content: flex-end; }
  .value { display: block; color: var(--accent); font-size: 12px; font-weight: 800; line-height: 1; }
  .direct { background: #f3f5f8; }
  .direct .value { color: var(--strong); font-size: 14px; }
  .value.zero { color: var(--zero); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

  .v5 { --bg: #ffffff; --ink: #161d2b; --strong: #0a2c73; --muted: #617087; --rule: #d7dee8; --accent: #e24434; --route: #205ec6; --zero: #a9b2bd; }
  .v5 .masthead { border-bottom: 4px solid var(--strong); }
  .v5 .masthead h1 { font-weight: 850; letter-spacing: -.07em; }

  @media (max-width: 620px) {
    .controlbar { padding: 9px 8px; gap: 6px 10px; }
    .stage { padding: 12px 0 40px; }
    .canvas { padding: 20px 8px 38px; }
    .masthead { gap: 12px; }
    .masthead h1 { font-size: 25px; }
    .tournament-tabs { gap: 4px 10px; padding-bottom: 14px; }
    .tournament-tab { font-size: 12px; }
    .group { margin-top: 17px; }
    .group-head { margin-bottom: 5px; }
    .group-tab { font-size: 14px; }
    thead th { padding: 5px 1px; font-size: 8px; }
    tbody th, tbody td { padding: 7px 1px; }
    .team-cell { grid-template-columns: 13px minmax(0, 1fr); column-gap: 3px; }
    .rank { font-size: 9px; }
    .short { font-size: 11px; }
    .record { font-size: 7px; }
    .prob { min-height: 26px; }
    .value { font-size: 9px; }
    .direct .value { font-size: 10px; }
  }
</style>

<div class="controlbar" aria-label="表示設定">
  <div class="control-group" aria-label="幅の切り替え">
    <span class="control-label">幅</span>
    <button type="button" data-width="mobile" aria-pressed="true">375px</button>
    <button type="button" data-width="full" aria-pressed="false">全幅</button>
  </div>
</div>

<main class="stage">
  <section class="canvas mobile v5" id="canvas" aria-live="polite"></section>
</main>

<script>
  const tournaments = [
    { id: "pacific", label: "Pacific" }
  ];

  const teams = [
    { id: "full-sense", name: "FULL SENSE", shortName: "FS" },
    { id: "global-esports", name: "Global Esports", shortName: "GE" },
    { id: "rex-regum-qeon", name: "Rex Regum Qeon", shortName: "RRQ" },
    { id: "nongshim-redforce", name: "Nongshim RedForce", shortName: "NS" },
    { id: "zeta-division", name: "ZETA DIVISION", shortName: "ZETA" },
    { id: "gen-g", name: "Gen.G", shortName: "GEN" },
    { id: "paper-rex", name: "Paper Rex", shortName: "PRX" },
    { id: "t1", name: "T1", shortName: "T1" },
    { id: "kiwoom-drx", name: "KIWOOM DRX", shortName: "KRX" },
    { id: "detonation-focusme", name: "DetonatioN FocusMe", shortName: "DFM" },
    { id: "team-secret", name: "Team Secret", shortName: "TS" },
    { id: "varrel", name: "VARREL", shortName: "VL" }
  ];

  const standings = {
    alpha: [
      ["gen-g", 4, 0], ["global-esports", 2, 2], ["zeta-division", 2, 1],
      ["full-sense", 1, 2], ["nongshim-redforce", 1, 2], ["rex-regum-qeon", 0, 3]
    ],
    omega: [
      ["paper-rex", 3, 1], ["varrel", 2, 1], ["t1", 2, 1],
      ["team-secret", 1, 3], ["kiwoom-drx", 1, 2], ["detonation-focusme", 1, 2]
    ]
  };

  const probabilities = {
    "full-sense": { direct: 0, positions: [0, 0, 0.15929, 0.31026, 0.3418, 0.18865] },
    "global-esports": { direct: 0.40694, positions: [0, 0.40694, 0.34217, 0.15616, 0.09473, 0] },
    "rex-regum-qeon": { direct: 0, positions: [0, 0, 0.00186, 0.23823, 0.26045, 0.49946] },
    "nongshim-redforce": { direct: 0.21813, positions: [0, 0.21813, 0.07152, 0.16041, 0.23805, 0.31189] },
    "zeta-division": { direct: 0.37493, positions: [0, 0.37493, 0.42516, 0.13494, 0.06497, 0] },
    "gen-g": { direct: 1, positions: [1, 0, 0, 0, 0, 0] },
    "paper-rex": { direct: 0.65605, positions: [0.4278, 0.22825, 0.24976, 0.09419, 0, 0] },
    "t1": { direct: 0.40584, positions: [0.18809, 0.21775, 0.28328, 0.085, 0.16408, 0.0618] },
    "kiwoom-drx": { direct: 0.24101, positions: [0.06298, 0.17803, 0.0412, 0.31, 0.21967, 0.18812] },
    "detonation-focusme": { direct: 0.12566, positions: [0.03121, 0.09445, 0.15488, 0.13439, 0.28001, 0.30506] },
    "team-secret": { direct: 0, positions: [0, 0, 0.12331, 0.25196, 0.20987, 0.41486] },
    "varrel": { direct: 0.57144, positions: [0.28992, 0.28152, 0.14757, 0.12446, 0.12637, 0.03016] }
  };

  const teamById = new Map(teams.map((team) => [team.id, team]));
  const canvas = document.querySelector("#canvas");
  let activeTournament = tournaments[0].id;
  let activeGroup = "alpha";
  let mobileWidth = true;

  function percent(value) {
    if (value === 0) return "0";
    if (value === 1) return "100";
    if (value < 0.005) return "<1";
    return String(Math.round(value * 100));
  }

  function probabilityCell(value, direct) {
    const zero = value === 0;
    return `<td class="${direct ? "direct" : ""}"><div class="prob"><span class="value${zero ? " zero" : ""}">${percent(value)}<span class="sr-only">%</span></span></div></td>`;
  }

  function teamRow(entry, index) {
    const [id, wins, losses] = entry;
    const team = teamById.get(id);
    const values = probabilities[id];
    return `<tr>
      <th scope="row"><div class="team-cell"><span class="rank">${index + 1}</span><span><span class="short">${team.shortName}</span><span class="record">${wins}–${losses}</span></span></div></th>
      ${probabilityCell(values.direct, true)}
      ${values.positions.map((value) => probabilityCell(value, false)).join("")}
    </tr>`;
  }

  function groupPanel(tournament, group) {
    const title = group === "alpha" ? "Alpha" : "Omega";
    const hidden = group === activeGroup ? "" : " hidden";
    return `<div id="${tournament}-group-panel-${group}" role="tabpanel" aria-labelledby="${tournament}-group-tab-${group}" tabindex="0"${hidden}>
      <table>
        <caption class="sr-only">${title}の順位別確率</caption>
        <colgroup><col class="team-col"><col class="direct-col"><col class="pos-col"><col class="pos-col"><col class="pos-col"><col class="pos-col"><col class="pos-col"><col class="pos-col"></colgroup>
        <thead><tr><th scope="col">現在順位・成績</th><th scope="col">Playoff</th>${[1, 2, 3, 4, 5, 6].map((position) => `<th scope="col">${position}位</th>`).join("")}</tr></thead>
        <tbody>${standings[group].map(teamRow).join("")}</tbody>
      </table>
    </div>`;
  }

  function tournamentTabs() {
    return `<div class="tournament-tabs" role="tablist" aria-label="大会選択">${tournaments.map((tournament) => {
      const selected = tournament.id === activeTournament;
      return `<button type="button" class="content-tab tournament-tab" role="tab" id="tournament-tab-${tournament.id}" aria-controls="tournament-panel-${tournament.id}" aria-selected="${selected}" tabindex="${selected ? 0 : -1}">${tournament.label}</button>`;
    }).join("")}</div>`;
  }

  function groupTabs(tournament) {
    return `<div class="group-head"><div class="group-tabs" role="tablist" aria-label="グループ選択">${["alpha", "omega"].map((group) => {
      const selected = group === activeGroup;
      const label = group === "alpha" ? "Alpha" : "Omega";
      return `<button type="button" class="content-tab group-tab" role="tab" id="${tournament}-group-tab-${group}" aria-controls="${tournament}-group-panel-${group}" aria-selected="${selected}" tabindex="${selected ? 0 : -1}">${label}</button>`;
    }).join("")}</div></div>`;
  }

  function render() {
    canvas.className = `canvas ${mobileWidth ? "mobile" : ""} v5`;
    canvas.innerHTML = `<header class="masthead"><div><h1>VCT QUALIFICATION</h1></div></header>
      ${tournamentTabs()}
      ${tournaments.map((tournament) => {
        const hidden = tournament.id === activeTournament ? "" : " hidden";
        return `<section id="tournament-panel-${tournament.id}" role="tabpanel" aria-labelledby="tournament-tab-${tournament.id}" tabindex="0"${hidden}>
          <div class="group">${groupTabs(tournament.id)}${groupPanel(tournament.id, "alpha")}${groupPanel(tournament.id, "omega")}</div>
        </section>`;
      }).join("")}`;
    bindTabs("tournament", tournaments.map(({ id }) => id), selectTournament);
    bindTabs(`${activeTournament}-group`, ["alpha", "omega"], selectGroup);
  }

  function bindTabs(prefix, ids, select) {
    const tabs = ids.map((id) => document.querySelector(`#${prefix}-tab-${id}`));
    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => select(ids[index]));
      tab.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        event.preventDefault();
        const direction = event.key === "ArrowRight" ? 1 : -1;
        select(ids[(index + direction + ids.length) % ids.length], true);
      });
    });
  }

  function selectTournament(tournament, moveFocus = false) {
    activeTournament = tournament;
    render();
    if (moveFocus) document.querySelector(`#tournament-tab-${tournament}`).focus();
  }

  function selectGroup(group, moveFocus = false) {
    activeGroup = group;
    render();
    if (moveFocus) document.querySelector(`#${activeTournament}-group-tab-${group}`).focus();
  }

  document.querySelectorAll("[data-width]").forEach((button) => button.addEventListener("click", () => {
    mobileWidth = button.dataset.width === "mobile";
    canvas.classList.toggle("mobile", mobileWidth);
    document.querySelectorAll("[data-width]").forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
  }));

  render();
</script>
